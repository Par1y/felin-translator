name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: building + uploading workflow artifacts needs no write scope.
# Bump to `contents: write` only if you later add `tagName:` to create a Release.
permissions:
  contents: read

env:
  # Tauri CLI pinned to the project's 2.x line (crate is tauri 2.11.x). Bump the
  # range if you move to the next major.
  TAURI_CLI_VERSION: '^2'

jobs:
  # ===========================================================================
  # Job 1 - checks: fast correctness gate (Rust workspace tests + TS typecheck).
  # ===========================================================================
  checks:
    name: checks (cargo test + tsc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Workspace root == repo root (root Cargo.toml); target/ lives at the root.
          # NB: differs from the Tauri docs' "./src-tauri -> target" (that assumes the
          # crate IS src-tauri; here src-tauri is just one member of the workspace).
          workspaces: '. -> target'

      - name: Install Linux system dependencies (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Typecheck frontend (tsc --noEmit)
        run: pnpm --dir ui run typecheck

      - name: Build frontend
        # Produce ui/dist so `tauri::generate_context!` (expanded while compiling the
        # felin-translator crate under `cargo test`) can find frontendDist ../ui/dist.
        run: pnpm --dir ui run build

      - name: Run Rust workspace tests
        run: cargo test --workspace --locked

  # ===========================================================================
  # Job 2 - build: Linux (.deb + portable loose-files tarball) and Windows (NSIS).
  # ===========================================================================
  build:
    name: build (${{ matrix.platform }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (not 24.04) => links against the older glibc 2.35, so the
          # .deb and the portable tarball run on a much wider range of distros.
          # AppImage is intentionally dropped (portable loose files cover that need).
          - platform: ubuntu-22.04
            args: '--bundles deb'
          - platform: windows-latest
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.platform }}

      - name: Install Linux system dependencies (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      # --- Sidecar: the OCR backend (ocr-cli) is user-provided via
      #     felin.toml [sidecar] bin / FELIN_SIDECAR and is NOT bundled into the
      #     release. mock-ocr-cli is automated-test-only and must never ship in
      #     a production bundle, so nothing is staged for bundle.externalBin. ---

      # --- Tauri CLI: the repo root (tauri-action's projectPath) has no package.json,
      #     so tauri-action's package-manager auto-detection cannot find a JS `tauri`
      #     script. Install a pinned CLI globally and point `tauriScript` straight at it. ---
      - name: Install Tauri CLI
        shell: bash
        run: npm install -g "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Run from the repo root: it holds src-tauri/. Tauri v2 runs
          # beforeBuildCommand ("pnpm build") with cwd = the frontend directory
          # (ui/, where ui/package.json lives); frontendDist ("../ui/dist") is
          # resolved relative to src-tauri/. The explicit build step above is
          # belt-and-suspenders — tauri re-runs beforeBuildCommand itself.
          projectPath: '.'
          # Use the globally installed CLI (skips tauri-action's detection, which would
          # otherwise fall back to auto-installing @tauri-apps/cli@v2 at build time).
          tauriScript: 'tauri'
          args: ${{ matrix.args }}

      # Portable "green" distribution: the app binary in one folder (data lives
      # next to the executable), tarred for download. The OCR backend (ocr-cli)
      # is user-provided and deliberately excluded from the bundle.
      - name: Package Linux loose files (portable)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/felin-translator
          cp target/release/felin-translator dist/felin-translator/
          tar -C dist -czf felin-translator-linux-x86_64.tar.gz felin-translator
          ls -la felin-translator-linux-x86_64.tar.gz

      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: felin-translator-${{ matrix.platform }}
          path: |
            target/release/bundle/deb/*.deb
            felin-translator-linux-x86_64.tar.gz
            target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
