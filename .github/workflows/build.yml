name: build

on:
  push:
    # Build ONLY on semver tags (v1.2.3 / v1.2.3-beta.1); pushes to branches do
    # NOT trigger a build — a run is triggered explicitly via the tag.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: checks + build need no write scope; the `release` job needs
# `contents: write` to create the GitHub Release and attach artifacts (scoped to
# that job only).
permissions:
  contents: read

env:
  # Tauri CLI pinned to the project's 2.x line (crate is tauri 2.11.x). Bump the
  # range if you move to the next major.
  TAURI_CLI_VERSION: '^2'

jobs:
  # ===========================================================================
  # Job 1 - checks: fast correctness gate (Rust workspace tests + TS typecheck).
  # Runs on every PR and tag. No real LLM key / network needed: all LLM tests
  # use wiremock (local mock server); the real-ocr e2e is #[ignore]d.
  # ===========================================================================
  checks:
    name: checks (cargo test + tsc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Workspace root == repo root (root Cargo.toml); target/ lives at the root.
          # NB: differs from the Tauri docs' "./src-tauri -> target" (that assumes the
          # crate IS src-tauri; here src-tauri is just one member of the workspace).
          workspaces: '. -> target'

      - name: Install Linux system dependencies (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Typecheck frontend (tsc --noEmit)
        run: pnpm --dir ui run typecheck

      - name: Build frontend
        # Produce ui/dist so `tauri::generate_context!` (expanded while compiling the
        # felin-translator crate under `cargo test`) can find frontendDist ../ui/dist.
        run: pnpm --dir ui run build

      - name: Run Rust workspace tests
        # --no-fail-fast so one suite failure doesn't mask the others.
        run: cargo test --workspace --locked --no-fail-fast

  # ===========================================================================
  # Job 2 - build: portable loose-files distribution per platform/arch, built
  # ONLY on semver tags. Windows + Linux target x64; macOS targets arm64
  # (macos-latest is Apple Silicon by default). No installer bundles — the data
  # lives next to the executable, so a plain folder/archive is the whole dist.
  # ===========================================================================
  build:
    name: build (${{ matrix.platform }} ${{ matrix.arch }})
    needs: checks
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (not 24.04) => links against the older glibc 2.35, so the
          # portable tarball runs on a much wider range of distros.
          - platform: ubuntu-22.04
            arch: x86_64
            binary: felin-translator
            artifact: felin-translator-linux-x86_64.tar.gz
          - platform: windows-latest
            arch: x86_64
            binary: felin-translator.exe
            artifact: felin-translator-windows-x86_64.zip
          # macos-latest defaults to arm64 (Apple Silicon); produces an arm64
          # .app (a double-clickable bundle that needs no installer). An intel
          # build is intentionally NOT done.
          - platform: macos-latest
            arch: aarch64
            binary: felin-translator
            artifact: felin-translator-macos-aarch64.tar.gz
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.platform }}

      - name: Install Linux system dependencies (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm --dir ui install --frozen-lockfile

      # --- Sidecar: the OCR backend (ocr-cli) is user-provided via
      #     felin.toml [sidecar] bin / FELIN_SIDECAR and is NOT bundled into the
      #     release. mock-ocr-cli is automated-test-only and must never ship in
      #     a production bundle, so nothing is staged for bundle.externalBin. ---

      # --- Tauri CLI: the repo root has no package.json, so install the pinned
      #     CLI globally and call it directly (cwd = repo root; tauri auto-finds
      #     src-tauri/ and runs beforeBuildCommand from the frontend dir ui/). ---
      - name: Install Tauri CLI
        run: npm install -g "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}"

      - name: Build app (release)
        shell: bash
        run: |
          # macOS: produce the .app bundle (arm64, from the arm runner) so the
          # result is a double-clickable app, not just a bare binary.
          # Linux/Windows: --no-bundle produces the bare binary only; the
          # loose-files archive is assembled manually below.
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            tauri build --bundles app
          else
            tauri build --no-bundle
          fi

      # ---------------------------------------------------------------
      # Portable loose-files distribution: the app in one folder (data lives
      # next to the executable). The OCR backend (ocr-cli) is user-provided
      # and deliberately excluded.
      # ---------------------------------------------------------------
      - name: Package Linux loose files (x64)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/felin-translator
          cp "target/release/${{ matrix.binary }}" dist/felin-translator/
          tar -C dist -czf "felin-translator-linux-x86_64.tar.gz" felin-translator

      - name: Package Windows loose files (x64)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/felin-translator
          cp "target/release/${{ matrix.binary }}" dist/felin-translator/
          powershell -Command "cd dist; Compress-Archive -Path felin-translator -DestinationPath ../felin-translator-windows-x86_64.zip -Force"

      - name: Package macOS loose files (arm64)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -R "target/release/bundle/macos/Felin Translator.app" dist/
          tar -C dist -czf "felin-translator-macos-aarch64.tar.gz" "Felin Translator.app"

      - name: Upload loose-files bundle
        uses: actions/upload-artifact@v7
        with:
          name: felin-translator-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          # A release build must produce its artifact; fail loudly if it didn't.
          if-no-files-found: error

  # ===========================================================================
  # Job 3 - release: attach the built archives to the GitHub Release for the
  # tag (created by the tag push). Runs only on semver tags; the source archive
  # GitHub auto-creates is NOT the product — the compiled bundles are.
  # ===========================================================================
  release:
    name: release (${{ github.ref_name }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Inspect downloaded bundles
        run: |
          ls -la dist/
          test -n "$(find dist -name '*.tar.gz' -o -name '*.zip')" || {
            echo "::error::no compiled bundles found to release"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
