[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Par1y"]
license = "MIT"

# Shared dependency versions live here so every workspace crate stays in lock-step.
# Populated by `cargo add ... --workspace` during scaffolding; members reference
# them with `dep = { workspace = true }`.
[workspace.dependencies]

[profile.dev]
# Faster incremental test cycles for the pure-Rust core.
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
